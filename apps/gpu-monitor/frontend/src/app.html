<!doctype html>
<html lang="ko" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(() => {
				const match = document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);
				if (!match) return;

				let value = match[1];
				try {
					value = decodeURIComponent(value);
				} catch {}

				const normalized = value.toLowerCase();
				const theme =
					normalized === 'light' || normalized === 'rose'
						? normalized
						: normalized === 'pink'
							? 'rose'
							: 'dark';

				document.documentElement.classList.remove('dark', 'light', 'rose');
				document.documentElement.classList.add(theme);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface text-white min-h-screen">
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>

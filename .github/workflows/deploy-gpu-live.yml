name: deploy-gpu-live

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  checks: read

defaults:
  run:
    shell: bash

concurrency:
  group: gpu-live
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize final main SHA for gpu-live
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Authorize deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3.12 scripts/authorize_gpu_release.py --repository ${{ github.repository }} --workflow-run-file ${{ github.event_path }} --live --required-check ci/required

  deploy:
    name: Deploy authorized SHA to gpu-live
    needs: authorize
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-24.04
    environment: gpu-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/gpu-monitor/frontend/package-lock.json

      - name: Build release artifact
        id: build
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="$SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA" >&2; exit 1; }
          release_dir=$(mktemp -d)
          apps/gpu-monitor/deploy/build-release.sh --sha "$sha" --output-dir "$release_dir"
          artifact="$release_dir/gpu-monitor-$sha.tar.gz"
          [[ -f "$artifact" ]] || { echo "release artifact missing" >&2; exit 1; }
          digest=$(python3.12 - "$artifact" <<'PY'
          import hashlib
          import sys
          path = sys.argv[1]
          h = hashlib.sha256()
          with open(path, "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  h.update(chunk)
          print(h.hexdigest())
          PY
          )
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid digest" >&2; exit 1; }
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy over forced SSH protocol
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
          GPU_DEPLOY_HOST: ${{ secrets.GPU_DEPLOY_HOST }}
          GPU_DEPLOY_PORT: ${{ secrets.GPU_DEPLOY_PORT }}
          GPU_DEPLOY_USER: ${{ secrets.GPU_DEPLOY_USER }}
          GPU_DEPLOY_SSH_KEY: ${{ secrets.GPU_DEPLOY_SSH_KEY }}
          GPU_DEPLOY_KNOWN_HOSTS: ${{ secrets.GPU_DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$SHA"
          digest="$DIGEST"
          artifact="$ARTIFACT"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA" >&2; exit 1; }
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid digest" >&2; exit 1; }
          [[ -f "$artifact" ]] || { echo "artifact missing" >&2; exit 1; }
          [[ "$GPU_DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid host" >&2; exit 1; }
          [[ "$GPU_DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid user" >&2; exit 1; }
          [[ "$GPU_DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( GPU_DEPLOY_PORT >= 1 && GPU_DEPLOY_PORT <= 65535 )) || { echo "invalid port" >&2; exit 1; }
          target="$GPU_DEPLOY_USER@$GPU_DEPLOY_HOST"
          [[ "$target" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+$ ]] || { echo "invalid target" >&2; exit 1; }

          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$GPU_DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$GPU_DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          [[ -s "$known_hosts" ]] || { echo "known_hosts is empty" >&2; exit 1; }
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o IdentitiesOnly=yes -i "$key_file" -p "$GPU_DEPLOY_PORT")

          ssh "${ssh_opts[@]}" "$target" "upload live $sha $digest" < "$artifact"
          current_main_sha=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq .object.sha)
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid current main SHA" >&2; exit 1; }
          [[ "$current_main_sha" == "$sha" ]] || { echo "workflow SHA is no longer current main" >&2; exit 1; }
          ssh "${ssh_opts[@]}" "$target" "activate live $sha $digest"
          ssh "${ssh_opts[@]}" "$target" "status live"

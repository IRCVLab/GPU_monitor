name: agent-bundle

# Builds and signs the host agent bundle for each main commit that passed ci.
# The release puller downloads the artifact for the SHA it activates and checks
# the signature against the key the hosts pin. Pull requests never reach this
# workflow: ci builds the same bundle there, unsigned.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  sign:
    name: agent-bundle/sign
    runs-on: ubuntu-24.04
    # The environment holds AGENT_SIGNING_KEY. A workflow_run job always runs on
    # the default branch, so an environment branch filter adds nothing here: the
    # `if:` below is what limits signing to a successful ci push run on main.
    environment: agent-signing
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/ci.yml'
    env:
      AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
    steps:
      - name: Checkout the commit ci approved
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and sign the agent bundle
        if: ${{ env.AGENT_SIGNING_KEY != '' }}
        run: make agent-bundle-signed OUTPUT_DIR="$RUNNER_TEMP/agent-bundle"
      - name: Upload the signed bundle
        if: ${{ env.AGENT_SIGNING_KEY != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: viz-agent-bundle-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/agent-bundle/
          if-no-files-found: error
          retention-days: 90
